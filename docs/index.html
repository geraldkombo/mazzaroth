<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mazzaroth — Daily Oracle</title>
<script src="data/daily.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#06060c;--card:#0c0c18;--border:#1a1a2e;--text:#c8c8d4;--dim:#666680;--accent:#7c5cfc;--peak:#ff4444;--vhigh:#ff8800;--high:#44cc44;--gold:#ffd700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.3px}
.sub{color:var(--dim);font-size:12px;margin:2px 0 12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.bar a{color:var(--dim);text-decoration:none;font-size:11px;padding:3px 10px;border-radius:4px;border:1px solid var(--border);cursor:pointer}
.bar a:hover,.bar a.on{color:#fff;border-color:var(--accent);background:#7c5cfc10}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}
.badge.peak{background:#ff444418;color:var(--peak);border:1px solid #ff444430}
.badge.vhigh{background:#ff880018;color:var(--vhigh);border:1px solid #ff880030}
.badge.high{background:#44cc4418;color:var(--high);border:1px solid #44cc4430}
.badge.normal{color:var(--dim)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:5px 8px;color:var(--dim);font-weight:500;font-size:9px;text-transform:uppercase;letter-spacing:0.6px;border-bottom:1px solid var(--border)}
td{padding:4px 8px;border-bottom:1px solid #1a1a2e40}
tr:last-child td{border-bottom:none}
.r{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:500}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px}
.grid{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.stat{padding:10px;text-align:center;background:#08081a;border-radius:6px;border:1px solid var(--border)}
.stat .n{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#fff}
.stat .l{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.area{padding:8px 12px;margin-bottom:4px;background:#08081a;border-radius:6px;border-left:3px solid var(--border)}
.area .t{display:flex;justify-content:space-between;align-items:center}
.area .hn{font-weight:600;color:#fff;font-size:12px;min-width:28px}
.area .nm{color:var(--dim);font-size:11px;flex:1}
.area .sc{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.area .as{font-size:10px;color:#555;margin-top:2px}
.dim{color:var(--dim)}
#hourly-bar{display:flex;gap:2px;overflow-x:auto;padding:8px 0}
.hour-block{flex:0 0 auto;width:36px;text-align:center;padding:4px 0;border-radius:4px;cursor:pointer;font-size:10px}
.hour-block .h{color:var(--dim)}
.hour-block .s{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.hour-block.peak{background:#ff444415}.hour-block.vhigh{background:#ff880015}.hour-block.high{background:#44cc4415}
.date-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.date-nav a{padding:2px 8px;border-radius:3px;font-size:11px;color:var(--dim);border:1px solid var(--border);cursor:pointer;text-decoration:none}
.date-nav a:hover,.date-nav a.on{color:#fff;border-color:var(--accent)}
#day-picker{background:var(--card);border:1px solid var(--border);padding:8px;border-radius:6px;margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#day-picker input{background:#08081a;border:1px solid var(--border);color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;font-family:'JetBrains Mono',monospace}
#day-picker button{background:var(--accent);color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px}
.footer{text-align:center;padding:20px 0;color:var(--dim);font-size:10px;border-top:1px solid var(--border);margin-top:16px}
.footer a{color:var(--accent);text-decoration:none}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">

<h1>MAZZAROTH</h1>
<div class="sub">Gerald Kombo &middot; 1989-09-13 Nairobi &middot; Profection H11</div>

<div class="bar" id="top-nav">
  <a class="on" onclick="showTab('today')">Today</a>
  <a onclick="showTab('hourly')">Hourly</a>
  <a onclick="showTab('calendar')">Calendar</a>
  <a onclick="showTab('database')">Database</a>
  <a onclick="showTab('areas')">Life Areas</a>
  <a onclick="showTab('wealth')">Wealth</a>
  <a onclick="showTab('audit')">Audit</a>
  <a onclick="showTab('houses')">13 Houses</a>
</div>

<div id="tab-today" class="tab"></div>
<div id="tab-hourly" class="tab" style="display:none"></div>
<div id="tab-calendar" class="tab" style="display:none"></div>
<div id="tab-database" class="tab" style="display:none"></div>
<div id="tab-areas" class="tab" style="display:none"></div>
<div id="tab-wealth" class="tab" style="display:none"></div>
<div id="tab-audit" class="tab" style="display:none"></div>
<div id="tab-houses" class="tab" style="display:none"></div>

<div class="footer">
  Mazzaroth v3 &middot; <a href="https://github.com/geraldkombo/mazzaroth">github.com/geraldkombo/mazzaroth</a>
</div>

</div>

<script>
const D = window.MD;
const LV = { PEAK:'peak', 'VERY HIGH':'vhigh', HIGH:'high', NORMAL:'normal' };
const HOUSE_NAMES = {
  1:'Identity, Self-Image, Personal Brand', 2:'Finances, Values, Self-Worth',
  3:'Communication, Siblings, Writing', 4:'Home, Family, Roots',
  5:'Creativity, Romance, Pleasure, Risk', 6:'Health, Daily Work, Routines, Service',
  7:'Partnerships, Marriage, Contracts', 8:'Sex, Intimacy, Shared Resources, Transformation',
  9:'Philosophy, Travel, Publishing', 10:'Career, Reputation, Legacy',
  11:'Friends, Networks, Community, Hopes', 12:'Solitude, Spirituality, Retreat, Subconscious',
  13:'Ophiuchus — Healing, Higher Service, Synthesis'
};
const CUSPS = {1:'Leo 138.2',2:'Virgo 174.0',3:'Libra 218.0',4:'Scorpius 241.0',5:'Ophiuchus 248.0',
  6:'Sagittarius 266.5',7:'Capricornus 300.0',8:'Aquarius 327.5',9:'Pisces 0.0',
  10:'Aries 27.0',11:'Taurus 53.5',12:'Gemini 90.4',13:'Cancer 118.1'};

function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.style.display='none');
  document.querySelectorAll('.bar a').forEach(a => a.classList.remove('on'));
  document.getElementById('tab-'+id).style.display='block';
  document.querySelector(`.bar a[onclick*="'${id}'"]`)?.classList.add('on');
  renderTab(id);
}

function renderTab(id) {
  if (id==='today') renderToday();
  else if (id==='hourly') renderHourly();
  else if (id==='calendar') renderCalendar();
  else if (id==='database') renderDatabase();
  else if (id==='areas') renderAreas();
  else if (id==='wealth') renderWealth();
  else if (id==='audit') renderAudit();
  else if (id==='houses') renderHouses();
}

function badge(lvl) {
  const cls = LV[lvl] || 'normal';
  return `<span class="badge ${cls}">${lvl}</span>`;
}

function renderToday() {
  const h = D.today_hourly;
  const latest = h.hourly.filter(x => x.score > 0).pop() || h.hourly[0];
  const peakCount = h.hourly.filter(x => x.level==='PEAK').length;
  const vhCount = h.hourly.filter(x => x.level==='VERY HIGH').length;
  const hiCount = h.hourly.filter(x => x.level==='HIGH').length;

  let html = `
  <div class="card" style="text-align:center;padding:28px 16px">
    <div style="font-size:48px;font-weight:700;letter-spacing:-1px;color:var(--peak)">${latest.score.toLocaleString()}</div>
    <div class="dim" style="font-size:12px;margin-top:4px">${h.date} &middot; ${badge(latest.level)}</div>
    <div style="font-size:15px;color:#fff;font-weight:500;margin-top:10px">${latest.top_transit}</div>
  </div>
  <div class="card">
    <h2>Today's Score by Hour</h2>
    <div id="hourly-bar">`;
  h.hourly.forEach(x => {
    const cls = LV[x.level] || '';
    html += `<div class="hour-block ${cls}" title="${x.time} - ${x.score} (${x.level})">
      <div class="h">${x.time}</div>
      <div class="s">${x.score.toFixed(0)}</div>
    </div>`;
  });
  html += `</div></div>
  <div class="card">
    <h2>Today Summary</h2>
    <div class="g3 grid" style="margin-top:6px">
      <div class="stat"><div class="n" style="color:var(--peak)">${peakCount}</div><div class="l">PEAK Hours</div></div>
      <div class="stat"><div class="n" style="color:var(--vhigh)">${vhCount}</div><div class="l">VH Hours</div></div>
      <div class="stat"><div class="n" style="color:var(--high)">${hiCount}</div><div class="l">HIGH Hours</div></div>
    </div>
  </div>`;

  // Next PEAK day
  const db = D.database;
  const today = h.date;
  const upcoming = db.filter(d => d.date > today && d.max_level === 'PEAK').slice(0,5);
  if (upcoming.length) {
    html += `<div class="card"><h2>Next PEAK Days</h2><table><tr><th>Date</th><th>Event</th><th class="r">Score</th></tr>`;
    upcoming.forEach(d => {
      const e = d.events[0];
      html += `<tr><td>${d.date}</td><td>${e ? e.transit : '--'}</td><td class="r" style="color:var(--peak)">${d.max_score.toLocaleString()}</td></tr>`;
    });
    html += `</table></div>`;
  }

  document.getElementById('tab-today').innerHTML = html;
}

function renderHourly() {
  const h = D.today_hourly;
  let html = `<div class="card"><h2>Hourly Breakdown — ${h.date}</h2><table><tr><th>Time</th><th>Score</th><th>Level</th><th>Top Transit</th></tr>`;
  h.hourly.forEach(x => {
    html += `<tr><td class="mono">${x.time}</td>
      <td class="r">${x.score.toFixed(0)}</td>
      <td>${badge(x.level)}</td>
      <td style="font-size:11px">${x.top_transit}</td></tr>`;
  });
  html += `</table></div>`;
  document.getElementById('tab-hourly').innerHTML = html;
}

function renderCalendar() {
  const db = D.database;
  const peaks = db.filter(d => d.max_level === 'PEAK');
  const vhs = db.filter(d => d.max_level === 'VERY HIGH');
  const his = db.filter(d => d.max_level === 'HIGH');
  let html = `
  <div class="card">
    <h2>Browse All Days</h2>
    <div id="day-picker">
      <input type="date" id="date-input" onchange="jumpToDate()">
      <button onclick="jumpToDate()">Go</button>
    </div>
  </div>
  <div class="card">
    <h2>High-Impact Days (${peaks.length + vhs.length + his.length})</h2>
    <div class="g3 grid" style="margin-bottom:10px">
      <div class="stat"><div class="n" style="color:var(--peak)">${peaks.length}</div><div class="l">PEAK</div></div>
      <div class="stat"><div class="n" style="color:var(--vhigh)">${vhs.length}</div><div class="l">VERY HIGH</div></div>
      <div class="stat"><div class="n" style="color:var(--high)">${his.length}</div><div class="l">HIGH</div></div>
    </div>
    <div class="date-nav">`;
  const years = [...new Set(db.map(d => d.date.slice(0,4)))].sort();
  years.forEach(y => {
    html += `<a onclick="filterYear('${y}')">${y}</a>`;
  });
  html += `</div><div id="calendar-list"></div></div>`;
  document.getElementById('tab-calendar').innerHTML = html;
  window._allDays = db;
  window._filter = '';
  renderCalendarList();
}

function filterYear(y) {
  window._filter = y;
  document.querySelectorAll('.date-nav a').forEach(a => a.classList.remove('on'));
  event.target.classList.add('on');
  renderCalendarList();
}

function renderCalendarList() {
  const db = window._allDays;
  const f = window._filter;
  const items = f ? db.filter(d => d.date.startsWith(f)) : db.slice(0,100);
  let html = '<table><tr><th>Date</th><th>Score</th><th>Level</th><th>Events</th></tr>';
  items.forEach(d => {
    if (d.event_count === 0) return;
    html += `<tr onclick="showDay('${d.date}')" style="cursor:pointer">
      <td class="mono">${d.date}</td>
      <td class="r">${d.max_score.toFixed(0)}</td>
      <td>${badge(d.max_level)}</td>
      <td style="font-size:11px">${d.events.map(e => e.transit).join(', ')}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('calendar-list').innerHTML = html;
}

function showDay(date) {
  const db = D.database;
  const day = db.find(d => d.date === date);
  if (!day || !day.events.length) return;
  let html = `<div class="card">
    <h2>${date} ${badge(day.max_level)}</h2>
    <table><tr><th>Transit</th><th>House</th><th class="r">Score</th><th>Level</th></tr>`;
  day.events.forEach(e => {
    html += `<tr><td style="font-size:11px">${e.transit}</td><td>H${e.house}</td>
      <td class="r">${e.score.toFixed(0)}</td><td>${badge(e.level)}</td></tr>`;
  });
  html += `</table><div style="margin-top:10px">
    <a onclick="renderCalendar()" style="cursor:pointer;color:var(--accent);font-size:12px">&larr; Back to calendar</a>
  </div></div>`;
  document.getElementById('tab-calendar').innerHTML = html;
}

function jumpToDate() {
  const val = document.getElementById('date-input').value;
  if (val) showDay(val);
}

function renderDatabase() {
  const db = D.database;
  const peaks = db.filter(d => d.max_level === 'PEAK');
  const vhs = db.filter(d => d.max_level === 'VERY HIGH');
  const his = db.filter(d => d.max_level === 'HIGH');
  const total = db.length;
  let html = `
  <div class="card">
    <h2>10-Year Database (${total} days with events)</h2>
    <div class="g3 grid">
      <div class="stat"><div class="n" style="color:var(--peak)">${peaks.length}</div><div class="l">PEAK Days</div></div>
      <div class="stat"><div class="n" style="color:var(--vhigh)">${vhs.length}</div><div class="l">VERY HIGH</div></div>
      <div class="stat"><div class="n" style="color:var(--high)">${his.length}</div><div class="l">HIGH Days</div></div>
    </div>
  </div>
  <div class="card">
    <h2>All PEAK Days</h2>
    <table><tr><th>Date</th><th>Score</th><th>Transit</th></tr>`;
  peaks.forEach(d => {
    const e = d.events[0];
    html += `<tr><td class="mono">${d.date}</td><td class="r" style="color:var(--peak)">${d.max_score.toFixed(0)}</td>
      <td style="font-size:11px">${e ? e.transit : ''}</td></tr>`;
  });
  html += `</table></div>`;
  document.getElementById('tab-database').innerHTML = html;
}

function renderAreas() {
  const areas = D.areas;
  let html = `<div class="card"><h2>All Life Areas — Today</h2>`;
  areas.forEach(a => {
    const cls = a.house === 2 ? 'color:var(--gold)' : a.house === 7 ? 'color:#ff6b9d' : a.house === 6 ? 'color:#81c784' : '';
    html += `<div class="area" style="border-left-color:${cls ? cls.split(':')[1] : 'var(--border)'}">
      <div class="t">
        <span class="hn">H${a.house}</span>
        <span class="nm">${a.name}</span>
        <span class="sc" style="${cls}">${a.score.toFixed(0)}</span>
      </div>
      <div class="as">${a.aspects.join(' &middot; ')}</div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('tab-areas').innerHTML = html;
}

function renderWealth() {
  const w = D.wealth;
  let html = `
  <div class="card" style="text-align:center;padding:24px">
    <div style="font-size:42px;font-weight:700;color:var(--gold)">${w.score.toFixed(0)}</div>
    <div class="dim" style="font-size:12px">Wealth Score &middot; ${w.patterns}/8 Billionaire Patterns Active</div>
    <div style="margin-top:8px"><span class="badge" style="background:#44cc4418;color:var(--high);border:1px solid #44cc4430">VERDICT: ${w.verdict}</span></div>
  </div>
  <div class="card">
    <h2>Natal Wealth Blueprint</h2>
    <table><tr><th>Planet</th><th>Role</th></tr>`;
  w.natal.forEach(n => {
    html += `<tr><td class="mono">${n.split(' — ')[0]}</td><td style="font-size:11px">${n.split(' — ')[1] || n}</td></tr>`;
  });
  html += `</table></div>`;
  document.getElementById('tab-wealth').innerHTML = html;
}

function renderAudit() {
  const a = D.audit;
  let html = `<div class="card"><h2>Ground Truth Audit (${a.length} entries)</h2>`;
  if (!a.length) {
    html += `<div class="dim">No audit entries yet. Rate outcomes with: python mazz.py audit rate 1-5 "tag"</div>`;
  } else {
    html += `<table><tr><th>Date</th><th>Score</th><th>Level</th><th>Outcome</th><th>Tag</th></tr>`;
    a.forEach(e => {
      html += `<tr><td class="mono">${e.date}</td><td class="r">${e.score}</td>
        <td>${badge(e.level)}</td><td class="r" style="color:${parseInt(e.outcome) >= 4 ? 'var(--high)' : 'var(--peak)'}">${e.outcome}/5</td>
        <td style="font-size:11px">${e.tag}</td></tr>`;
    });
    html += `</table>`;
  }
  html += `</div>`;
  document.getElementById('tab-audit').innerHTML = html;
}

function renderHouses() {
  let html = `<div class="card"><h2>The 13-House System</h2>
    <table><tr><th>House</th><th>Constellation</th><th>Cusp</th><th>Domain</th></tr>`;
  for (let h = 1; h <= 13; h++) {
    html += `<tr><td>H${h}</td><td>${CUSPS[h].split(' ')[0]}</td><td class="mono">${CUSPS[h].split(' ')[1]}</td>
      <td style="font-size:11px">${HOUSE_NAMES[h]}</td></tr>`;
  }
  html += `</table></div>`;
  document.getElementById('tab-houses').innerHTML = html;
}

// Initial render
renderToday();
</script>
</body>
</html>
