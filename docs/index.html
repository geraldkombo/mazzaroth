<style>
:root{--bg:#06060c;--card:#0c0c18;--border:#1a1a2e;--text:#c8c8d4;--dim:#666680;--accent:#7c5cfc;--peak:#ff4444;--vhigh:#ff8800;--high:#44cc44;--gold:#ffd700}
.action{display:flex;gap:8px;align-items:flex-start;margin:4px 0;padding:6px 8px;border-radius:4px;font-size:12px;line-height:1.5}
.action.do{background:#44cc4408;border-left:2px solid var(--high)}
.action.dont{background:#ff444408;border-left:2px solid var(--peak)}
.action.watch{background:#7c5cfc08;border-left:2px solid var(--accent)}
.action .label{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.8px;white-space:nowrap;min-width:44px}
.action.do .label{color:var(--high)}
.action.dont .label{color:var(--peak)}
.action.watch .label{color:var(--accent)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.3px}
.sub{color:var(--dim);font-size:12px;margin:2px 0 12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.bar a{color:var(--dim);text-decoration:none;font-size:11px;padding:3px 10px;border-radius:4px;border:1px solid var(--border);cursor:pointer}
.bar a:hover,.bar a.on{color:#fff;border-color:var(--accent);background:#7c5cfc10}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}
.badge.peak{background:#ff444418;color:var(--peak);border:1px solid #ff444430}
.badge.vhigh{background:#ff880018;color:var(--vhigh);border:1px solid #ff880030}
.badge.high{background:#44cc4418;color:var(--high);border:1px solid #44cc4430}
.badge.normal{color:var(--dim)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:5px 8px;color:var(--dim);font-weight:500;font-size:9px;text-transform:uppercase;letter-spacing:0.6px;border-bottom:1px solid var(--border)}
td{padding:4px 8px;border-bottom:1px solid #1a1a2e40}
tr:last-child td{border-bottom:none}
.r{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:500}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px}
.grid{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.stat{padding:10px;text-align:center;background:#08081a;border-radius:6px;border:1px solid var(--border)}
.stat .n{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#fff}
.stat .l{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.area{padding:8px 12px;margin-bottom:4px;background:#08081a;border-radius:6px;border-left:3px solid var(--border)}
.area .t{display:flex;justify-content:space-between;align-items:center}
.area .hn{font-weight:600;color:#fff;font-size:12px;min-width:28px}
.area .nm{color:var(--dim);font-size:11px;flex:1}
.area .sc{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.area .as{font-size:10px;color:#555;margin-top:2px}
.dim{color:var(--dim)}
#hourly-bar{display:flex;gap:2px;overflow-x:auto;padding:8px 0}
.hour-block{flex:0 0 auto;width:36px;text-align:center;padding:4px 0;border-radius:4px;cursor:pointer;font-size:10px}
.hour-block .h{color:var(--dim)}
.hour-block .s{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.hour-block.peak{background:#ff444415}.hour-block.vhigh{background:#ff880015}.hour-block.high{background:#44cc4415}
.date-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.date-nav a{padding:2px 8px;border-radius:3px;font-size:11px;color:var(--dim);border:1px solid var(--border);cursor:pointer;text-decoration:none}
.date-nav a:hover,.date-nav a.on{color:#fff;border-color:var(--accent)}
#day-picker{background:var(--card);border:1px solid var(--border);padding:8px;border-radius:6px;margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#day-picker input{background:#08081a;border:1px solid var(--border);color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;font-family:'JetBrains Mono',monospace}
#day-picker button{background:var(--accent);color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px}
.touch{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
summary{cursor:pointer;color:var(--accent);font-size:11px;padding:4px 0}
details{padding:4px 0}
details ul{list-style:none;padding:4px 0 0 12px;font-size:10px;color:var(--dim);line-height:1.8}
.banner-peak{background:#c62828;color:#fff;padding:10px 14px;border-radius:6px;font-size:11px;font-weight:600;text-align:center;letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.4);margin-bottom:10px}
.scroll-hint{font-size:9px;color:var(--dim);text-align:center;padding:2px 0 4px;letter-spacing:.5px}
.wealth-meter{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}
.wealth-meter div{height:100%;border-radius:3px;transition:width .3s}
.log-entry{padding:6px 8px;margin:3px 0;background:#08081a;border-radius:4px;font-size:11px;display:flex;gap:8px;align-items:center}
.log-entry .d{color:var(--dim);min-width:80px}
.log-entry .s{font-weight:600;font-family:'JetBrains Mono',monospace}
.log-entry .n{color:var(--dim);font-size:10px;flex:1}
.card-form{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.card-form input,.card-form select,.card-form textarea{background:#08081a;border:1px solid var(--border);color:#fff;padding:6px 8px;border-radius:4px;font-size:11px;font-family:'Inter',sans-serif}
.card-form textarea{width:100%;resize:vertical}
.card-form button{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:500}
.card-form button:hover{opacity:.85}
.btn-sm{background:transparent;color:var(--dim);border:1px solid var(--border);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px}
.btn-sm:hover{color:#fff;border-color:var(--accent)}
.footer{text-align:center;padding:20px 0;color:var(--dim);font-size:10px;border-top:1px solid var(--border);margin-top:16px}
.footer a{color:var(--accent);text-decoration:none}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
select, input[type=number]{font-family:'Inter',sans-serif}
.ai-chat{display:flex;flex-direction:column;height:calc(100vh - 160px);min-height:420px}
.ai-scroll{flex:1;overflow-y:auto;padding:12px 4px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:88%;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai-user{align-self:flex-end;background:#7c5cfc22;border:1px solid #7c5cfc44;color:#e6e0ff}
.ai-bot{align-self:flex-start;background:#0d0d1c;border:1px solid var(--border);color:var(--text)}

.ai-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ai-chip{background:#08081a;border:1px solid var(--border);color:var(--dim);font-size:10px;padding:5px 10px;border-radius:14px;cursor:pointer}
.ai-chip:hover{color:#fff;border-color:var(--accent);background:#7c5cfc10}
.ai-input-row{display:flex;gap:8px;margin-top:10px}
.ai-input-row textarea{flex:1;background:#08081a;border:1px solid var(--border);color:#fff;padding:10px;border-radius:8px;font-size:12px;font-family:'Inter',sans-serif;resize:none;height:48px}
.ai-input-row button{background:var(--accent);color:#fff;border:none;padding:0 18px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}

function focusStar(h) {
  const f = getFocus();
  if (f === h) return '★';

function focusLabel(f) {
  if (!f) return '';

function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.style.display='none');
  document.querySelectorAll('.bar a').forEach(a => a.classList.remove('on'));
  document.getElementById('tab-'+id).style.display='block';
  document.querySelector(`.bar a[onclick*="'${id}'"]`)?.classList.add('on');
  renderTab(id);
}

  if (id==='today') renderToday();

  else if (id==='location') renderLocation();
  else if (id==='relationships') renderRelationships();
  else if (id==='farm') renderFarm();
  else if (id==='ai') renderAI();
}

function badge(lvl) {
  const cls = LV[lvl] || 'normal';

function to12h(t) {
  const [h, m] = t.split(':');
  const hour = parseInt(h);
  const ampm = hour >= 12 ? 'PM' : 'AM';
  const h12 = hour % 12 || 12;
  return `${h12}:${m}${ampm}`;

function computeRising(lat, lon) {
  const D = window.MD;
  const dt = new Date(D.today_hourly.date + 'T12:00:00Z');
  const jd = 2451545.0 + (dt.getTime() / 86400000) + 40587;
  const T = (jd - 2451545.0) / 36525.0;
  let GMST = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - T * T * T / 38710000.0;
  GMST = ((GMST % 360) + 360) % 360;
  const LST = ((GMST + lon + 360) % 360);
  const epsRad = (23.439291 - 0.0130042 * T) * Math.PI / 180;
  const latRad = lat * Math.PI / 180;
  const RAMCRad = LST * Math.PI / 180;
  let Asc = Math.atan2(-(Math.tan(epsRad) * Math.sin(RAMCRad) + Math.sin(latRad) * Math.sin(epsRad)), Math.cos(RAMCRad)) * 180 / Math.PI;
  Asc = ((Asc % 360) + 360) % 360;
  let MC = ((LST + 360) % 360);
  const ascConst = lonToConst(Asc);
  const mcConst = lonToConst(MC);
  const house1 = ((IAU_CONST.findIndex(c => c[2] === ascConst) - IAU_CONST.findIndex(c => c[2] === lonToConst(170.5)) + 13) % 13) + 1;
  return { asc: Asc.toFixed(1), mc: MC.toFixed(1), ascConst, mcConst, ascHouse: house1 };
}

    .replace(/^### (.*)$/gm,'<h3 style="color:var(--text);margin:10px 0 4px;font-size:13px">$1</h3>')
    .replace(/^## (.*)$/gm,'<h2 style="color:var(--gold);margin:12px 0 4px;font-size:14px">$1</h2>')
    .replace(/^# (.*)$/gm,'<h1 style="color:#fff;margin:8px 0;font-size:16px">$1</h1>')
    .replace(/^\s*>\s?(.*)$/gm,'<blockquote style="border-left:2px solid var(--gold);padding-left:8px;margin:4px 0;color:var(--dim)">$1</blockquote>')
    .replace(/\*\*(.+?)\*\*/g,'<b style="color:#fff">$1</b>')

    .replace(/^---$/gm,'<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">');
}

function calRender() {
  const y = window._calYear;
  const m = window._calMonth;
  const db = window._calAll;
  document.getElementById('cal-header').textContent = new Date(y,m-1,1).toLocaleString('en',{month:'long',year:'numeric'});
  const first = new Date(y,m-1,1).getDay();
  const daysInMonth = new Date(y,m,0).getDate();
  const offset = first === 0 ? 6 : first - 1;
  let html = '';
  for (let i = 0; i < offset; i++) html += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${m.padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const entry = db.find(x => x.date === dateStr);
    const lvl = entry ? entry.max_level : '';
    const score = entry ? entry.max_score : 0;
    const bg = lvl === 'PEAK' ? 'var(--peak)' : lvl === 'VERY HIGH' ? 'var(--vhigh)' : lvl === 'HIGH' ? 'var(--high)' : entry ? 'var(--card)' : 'transparent';
    const txt = lvl ? '#fff' : 'var(--dim)';
    const title = entry && entry.event_count > 0 ? `${dateStr}: ${score.toFixed(0)} ${lvl}` : dateStr;
    html += `<div onclick="showDay('${dateStr}')" title="${title}" style="cursor:pointer;padding:4px 2px;text-align:center;border-radius:3px;background:${bg};color:${txt};font-size:10px;font-weight:${lvl?'600':'400'}">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function calPrev() {
  let y = parseInt(window._calYear);

  if (m < 1) { m = 12; y--; }
  window._calYear = String(y);
  window._calMonth = String(m).padStart(2,'0');
  calRender();
}

function calNext() {
  let y = parseInt(window._calYear);
  let m = parseInt(window._calMonth) + 1;
  if (m > 12) { m = 1; y++; }
  window._calYear = String(y);
  window._calMonth = String(m).padStart(2,'0');
  calRender();
}

function mazziMove(today, areas, h2Score) {
  const t = today.hourly.filter(x => x.score > 0).pop() || today.hourly[0];
  const transit = (t.top_transit || '').toLowerCase();
  const isPeak = t.level === 'PEAK';
  const isHigh = t.level === 'VERY HIGH' || t.level === 'HIGH';
  const isRest = !isPeak && !isHigh;
  const h2 = areas.find(a => a.house === 2);

  // Determine planet type
  const hasJup = transit.includes('jup');
  const hasSat = transit.includes('sat');
  const hasMar = transit.includes('mar');
  const hasVen = transit.includes('ven');
  const hasMerc = transit.includes('merc');
  const hasPlu = transit.includes('plu');
  const hasNep = transit.includes('nep');
  const hasUra = transit.includes('ura');
  const hasSun = transit.includes('sun');
  const hasMoon = transit.includes('moo');
  const retros = (t.retrograde_planets || []).filter(r => !r.includes('Node'));
  const mercRx = retros.some(r => r.includes('Merc'));
  const retrosStr = retros.map(r => r.split(' ')[0]).join(', ');

  // H2 wealth info from natal
  const n = D.natal;
  const h2planets = n.houses && n.houses['2'] ? n.houses['2'].join(', ') : 'Mercury, Venus, Mars';

  // Build Mazzi's move — wiring-first (H2 deals/value, H7 contracts), planet-nuanced
  if (isPeak && hasJup && h2 && h2.score > 0) return `Jupiter lighting your H2 (${h2planets}) on a PEAK day — your best window to ASK: raise the price, send the proposal, name the number. Jupiter expands whatever you say out loud.`;
  if (isPeak && hasVen) return `Venus on a PEAK day — your value is visible. Charge properly, convert a relationship into revenue, or collect what you're owed. This is a receiving day, not a spending day.`;
  if (isPeak && hasMar) return `Mars on PEAK — bold earning energy. Make the ask, chase the invoice, close the deal. One target, full force.`;
  if (isPeak && hasPlu) return `Pluto on PEAK — restructure the money model. Cut a draining stream or reprice from zero. Deep change, clean result.`;
  if (isPeak && hasSat) return `Saturn on PEAK — structure creates wealth. Cement one agreement or system that pays for years. Patience compounds.`;
  if (isPeak) return `PEAK day — your strongest action window. Make the money ask you've been rehearsing. Decisions here compound.`;
  if (isHigh && hasJup) return `Jupiter in a HIGH window — prepare the ask, don't fire it yet. Draft the pricing/proposal now so you can move on the PEAK.`;
  if (isHigh && (hasMerc || hasSun)) return `Mercury/Sun active — sharpen the message and the number. One conversation prepared now pays later.`;
  if (isHigh) return `HIGH energy — good for building, not closing. Prep your pitch, refine the offer, line up the person you will ask.`;
  if (mercRx) return `Mercury retrograde — revisit, don't launch. Fix an old deal's terms or renegotiate a price. Wait to sign the new one.`;
  if (isRest && hasMoon) return `Moon day — emotional money risk. Pause purchases; decide nothing about money from mood.`;
  if (isRest) return `Rest window — protect capital, build the list not the spend. Your next action window is coming.`;
  return `Quiet sky — no money moves needed. Track one number and prepare the next ask.`;
}

const RATE_KEY = 'mazz_rates';
function loadRates() { try { return JSON.parse(localStorage.getItem(RATE_KEY)) || []; } catch(e) { return []; } }
function saveRate() {
  const input = document.getElementById('rate-input');
  const val = parseFloat(input.value);
  if (!val || val <= 0) { localStorage.removeItem(RATE_KEY); document.getElementById('rate-history').innerHTML = 'Cleared.'; input.value=''; return; }
  const rates = loadRates();
  rates.push({date: D.today_hourly.date, rate: val});
  if (rates.length > 60) rates.splice(0, rates.length - 60);
  localStorage.setItem(RATE_KEY, JSON.stringify(rates));
  input.value = '';
  displayRates(rates);
}
function displayRates(rates) {
  const el = document.getElementById('rate-history');
  if (!rates.length) { el.innerHTML = 'No rates saved yet. Enter today\'s rate above.'; return; }
  const last = rates[rates.length - 1];
  const prev = rates.length > 1 ? rates[rates.length - 2] : null;
  const change = prev ? (last.rate - prev.rate).toFixed(2) : '—';
  const dir = change > 0 ? '↑ KES weakening' : change < 0 ? '↓ KES strengthening' : '—';
  const color = change > 0 ? 'var(--peak)' : change < 0 ? 'var(--high)' : 'var(--dim)';
  const recent = rates.slice(-7).reverse();
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:4px;padding:4px 6px;background:#08081a;border-radius:4px">
      <span><b>Last:</b> ${last.rate} KES/USD (${last.date})</span>
      <span style="color:${color}">${change} ${dir}</span>
    </div>
    <div style="font-size:9px;color:var(--dim);margin-bottom:4px">Last 7 entries:</div>
    ${recent.map(r => `<div style="display:flex;justify-content:space-between;padding:2px 6px"><span class="mono">${r.date}</span><span class="mono">${r.rate}</span></div>`).join('')}
    <div style="margin-top:4px;padding:4px 6px;background:#08081a;border-radius:4px;font-size:9px;color:var(--accent)">
      ${change > 0 ? '⚠️ KES weakening — consider buying USD now if PEAK day.' : change < 0 ? '✅ KES strengthening — hold off on USD if you can wait.' : 'No trend yet. Save more entries.'}
    </div>`;
}

const AUDIT_KEY = 'mazz_audit';
function loadLocalAudits() {
  try { return JSON.parse(localStorage.getItem(AUDIT_KEY)) || []; } catch(e) { return []; }
}
function saveLocalAudits(log) {
  localStorage.setItem(AUDIT_KEY, JSON.stringify(log));
}
function exportAuditCSV(log) {
  if (!log.length) { alert('No audit entries to export.'); return; }
  const h = ['Date','Outcome','Notes','Level','Score','Transit'];
  const csv = h.join(',') + '\n' + log.map(e =>
    `"${e.date}","${e.outcome}","${(e.notes||'').replace(/"/g,'""')}","${e.level||''}","${e.score||''}","${e.transit||''}"`
  ).join('\n');
  const b = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'mazz_audit_export.csv';
  a.click();
}
function importAuditCSV(evt) {
  const f = evt.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function() {
    const lines = r.result.split('\n');
    const log = loadLocalAudits();
    let count = 0;
    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].match(/"([^"]*)"|([^,]+)/g);
      if (!parts || parts.length < 2) continue;
      const date = (parts[0]||'').replace(/"/g,'').trim();
      const outcome = parseInt((parts[1]||'').replace(/"/g,'')) || 3;
      const notes = (parts[2]||'').replace(/"/g,'').trim();
      const level = (parts[3]||'').replace(/"/g,'').trim();
      const score = (parts[4]||'').replace(/"/g,'').trim();
      const transit = (parts[5]||'').replace(/"/g,'').trim();
      if (date) { log.unshift({date,outcome,notes,level,score,transit}); count++; }
    }
    saveLocalAudits(log);
    renderAudit();
    alert(`Imported ${count} entries.`);
  };
  r.readAsText(f);
  evt.target.value = '';
}

function submitAudit() {
  const date = document.getElementById('aud-date').value;

  const today = D.today_hourly.date;

function checkBirthYear() {
  const input = document.getElementById('by-input');
  const yr = parseInt(input.value);
  const result = document.getElementById('by-result');
  if (!yr || yr < 1900 || yr > 2030) { result.innerHTML = '<span class="dim">Enter a valid year (1900-2030).</span>'; return; }

  const n = D.natal;
  const sun = n.planets.find(p=>p.name==='Sun');
  const moon = n.planets.find(p=>p.name==='Moon');
  const natalConst = sun ? sun.constellation : 'Leo';
  const natalMoonConst = moon ? moon.constellation : 'Capricornus';

  const age = 2026 - yr;
  const ageLabel = age < 20 ? `~${age}yo (younger)` : age < 30 ? `~${age}yo` : age < 40 ? `~${age}yo` : age < 50 ? `~${age}yo (older)` : `~${age}yo (older, no judgment)`;

  // Chinese zodiac from engine (1989 → Snake)
  const myAnimalIdx = (1989 + 8) % 12;
  const animals = ['Monkey','Rooster','Dog','Pig','Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat'];
  const myAnimal = animals[myAnimalIdx];
  const theirAnimal = animals[yr % 12];
  const bestForSnake = ['Ox','Rooster','Snake'];
  const isAnimalMatch = bestForSnake.includes(theirAnimal);
  const isAnimalConflict = ['Dragon','Dog'].includes(theirAnimal);

  // Sun sign from actual natal constellation
  const fireSigns = ['Aries','Leo','Sagittarius'];
  const airSigns = ['Gemini','Libra','Aquarius'];
  const earthSigns = ['Taurus','Virgo','Capricornus','Capricorn'];
  const waterSigns = ['Cancer','Scorpius','Pisces'];
  const fireAir = [...fireSigns, ...airSigns];

  // Generational sync from engine natal planetary spread
  const outerLons = n.planets.filter(p=>['Jupiter','Saturn','Uranus','Neptune','Pluto'].includes(p.name)).map(p=>p.lon);
  const genGroup = yr >= 1983 && yr <= 1996;

  // Score out of 10
  let score = 5;
  let points = [];
  if (isAnimalMatch) { score += 2; points.push('Zodiac match (Snake + ' + theirAnimal + ')'); }
  else if (isAnimalConflict) { score -= 1; points.push('Zodiac tension (Snake + ' + theirAnimal + ')'); }
  else { points.push('Zodiac neutral (' + theirAnimal + ')'); }

  if (genGroup) { score += 2; points.push('Same generation — outer planets align'); }
  else { points.push('Different generation — outer planets differ'); }

  // Check if their Sun would be in fire/air based on typical Sun degrees (approximate from year+month)
  // We use the dominant sign from their estimated age
  if (age >= -5 && age <= 5) { score += 1; points.push('Close age cohort — life stage sync'); }
  else if (age >= 10) { points.push('Age gap ' + age + ' years — maturity dynamic, no judgment'); }

  score = Math.max(0, Math.min(10, score));
  const stars = '★'.repeat(Math.floor(score/2)) + '☆'.repeat(5 - Math.floor(score/2));
  const color = score >= 8 ? 'var(--high)' : score >= 5 ? 'var(--gold)' : 'var(--dim)';

  result.innerHTML = `<div style="padding:8px;background:#08081a;border-radius:4px">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px">
      <span><b>Year ${yr}</b> · ${theirAnimal} · ${ageLabel}</span>
      <span style="color:${color};font-size:14px">${stars} ${score}/10</span>
    </div>
    <ul style="margin:4px 0 0;padding-left:14px;font-size:10px;color:var(--dim);line-height:1.6">
      ${points.map(p => `<li>${p}</li>`).join('')}
    </ul>
    <div style="margin-top:4px;font-size:10px">${score >= 8 ? '✅ Strong resonance. Worth exploring.' : score >= 5 ? '🔸 Mixed signals. Depends on full chart.' : '⚠️ Some friction. Would need strong moon/rising sync.'}</div>
  </div>`;
}

function useGeolocation() {
  if (!navigator.geolocation) { alert('Geolocation not supported by your browser.'); return; }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      renderLocationResult(lat, lon, `Your location (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
    },
    function(err) {
      alert('Could not get location. Select a town from the list or enter coordinates manually.');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function showLocation(sel) {
  const idx = parseInt(sel.value);
  if (idx < 0) { document.getElementById('loc-result').innerHTML = ''; return; }
  const keys = Object.keys(KENYAN_CITIES);
  const key = keys[idx];
  const [lat, lon] = KENYAN_CITIES[key];
  renderLocationResult(lat, lon, key.replace('★ ',''));
}

function showLocationCoords() {
  const lat = parseFloat(document.getElementById('loc-lat').value);

  if (isNaN(lat) || isNaN(lon)) { alert('Enter valid latitude and longitude.'); return; }

  document.getElementById('loc-result').innerHTML = html;
}

// ===================== Ask Mazzi — AI Reading Coach =====================
window._mazzi = { history: [], rendered: false };
const MAZZI_KEY = 'mazzi_chat';

function mazziLoadHistory() {
  try { const s = JSON.parse(localStorage.getItem(MAZZI_KEY)); if (Array.isArray(s)) return s.slice(-20); } catch(e) {}
  return [];
}

function mazziPersist() {
  try { localStorage.setItem(MAZZI_KEY, JSON.stringify(window._mazzi.history.slice(-20))); } catch(e) {}
}

function mazziScrollBottom() {
  const s = document.getElementById('mazzi-scroll');
  if (s) s.scrollTop = s.scrollHeight;
}

function mazziMarkdown(txt) {
  const esc = String(txt || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = esc.split('\n');
  let html = '', inList = false;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { if (inList) { html += '</ul>'; inList = false; } continue; }
    const h = line.match(/^#{1,3}\s+(.*)$/);
    if (h) { if (inList) { html += '</ul>'; inList = false; } html += '<b>' + h[1] + '</b>'; continue; }
    const li = line.match(/^[-*]\s+(.*)$/);
    if (li) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + li[1].replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</li>';
      continue;
    }
    const num = line.match(/^(\d+)[.)]\s+(.*)$/);
    if (num) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<br><b>' + num[1] + '.</b> ' + num[2].replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    const cooked = line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    html += '<div style="margin-top:4px">' + cooked + '</div>';
  }
  if (inList) html += '</ul>';
  return html;
}

function mazziBubble(m) {
  const cls = m.role === 'user' ? 'ai-user' : 'ai-bot';
  const content = m.role === 'user'
    ? String(m.content || '').replace(/</g, '&lt;')
    : mazziMarkdown(m.content);
  return '<div class="ai-msg ' + cls + '">' + content + '</div>';
}

function mazziGhost() {
  return '<div class="ai-ghost"><div style="font-size:30px;margin-bottom:8px">🔮</div>' +
    '<span class="m">Mazzi</span> reads your Mazzaroth engine data and explains it in plain language — ' +
    'what is happening today, what to do, when, and what to avoid.<br>' +
    '<span class="dim">Ask anything about your reading, a house, a transit, or timing.</span></div>';
}

function mazziContext() {
  const h = D.today_hourly || { date: '', hourly: [] };
  const today = h.date;
  const db = D.database || [];
  const areas = D.areas || [];
  const w = D.wealth || {};
  const n = D.natal || {};
  const latest = h.hourly.filter(x => x.score > 0).pop() || h.hourly[h.hourly.length - 1] || {};
  const actTimes = h.hourly.filter(x => hourAction(x) === 'ACT').map(x => to12h(x.time));
  const eventsToday = [];
  db.filter(d => d.date === today).forEach(d => (d.events || []).forEach(e =>
    eventsToday.push({ transit: e.transit, house: e.house, level: e.level, aspect: e.aspect, meaning: e.meaning, actions: e.actions })));
  const dayHouse = eventsToday.length ? eventsToday[0].house : null;
  const upcoming = db.filter(d => d.date > today && d.event_count > 0)
    .sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6)
    .map(d => ({ date: d.date, level: d.max_level, score: Math.round(d.max_score), transit: (d.events[0] || {}).transit, house: (d.events[0] || {}).house }));
  const topAreas = [...areas].sort((a, b) => b.score - a.score).slice(0, 3)
    .map(a => ({ house: a.house, name: a.name, score: Math.round(a.score), aspects: (a.aspects || []).slice(0, 3) }));
  return {
    date: today,
    score: latest.score ? Math.round(latest.score) : null,
    level: latest.level || null,
    top_transit: latest.top_transit || null,
    house: latest.house || dayHouse || null,
    thresholds: { peak: TH.peak, vhigh: TH.vhigh, high: TH.high },
    profection: {
      house: PROF_HOUSE,
      name: (HOUSE_NAMES[PROF_HOUSE] || '').split(',')[0],
      age: (D.profection && D.profection.age) || new Date().getFullYear() - BIRTH_YEAR,
      occupants: (D.profection && D.profection.name) || [],
    },
    retrogrades: latest.retrograde_planets || [],
    act_hours: actTimes,
    events_today: eventsToday,
    upcoming,
    top_areas: topAreas,
    reading: D.reading ? {
      headline: D.reading.headline, story: D.reading.story,
      moves: D.reading.moves, watch: D.reading.watch,
      axis_focus: D.reading.axis_focus,
    } : null,
    wealth: w.score ? { score: Math.round(w.score), verdict: w.verdict, patterns: w.patterns, pattern_names: w.pattern_names || [] } : null,
    blueprint: D.blueprint ? {
      headline: D.blueprint.constitution && D.blueprint.constitution.headline,
      year: D.blueprint.year && D.blueprint.year.meaning,
      weekly: D.blueprint.year && D.blueprint.year.weekly,
      helps: D.blueprint.helps_now || [],
      avoid: D.blueprint.avoid_now || [],
      money: D.blueprint.constitution && D.blueprint.constitution.money_wiring.read,
      relation: D.blueprint.constitution && D.blueprint.constitution.relationship_wiring.read,
      work: D.blueprint.constitution && D.blueprint.constitution.work_wiring.read,
    } : null,
    natal: n.planets ? {
      sun: (n.planets.find(p => p.name === 'Sun') || {}).constellation,
      moon: (n.planets.find(p => p.name === 'Moon') || {}).constellation,
      h2: (n.houses && n.houses['2']) || [],
      houses: n.houses || {},
    } : null,
  };
}

function renderAI() {
  const st = window._mazzi;
  if (!st.rendered) { st.rendered = true; st.history = mazziLoadHistory(); }
  document.getElementById('tab-ai').innerHTML =
    '<div class="card" style="padding:0;display:flex;flex-direction:column;height:calc(100vh - 215px);min-height:440px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)">' +
        '<div><span style="color:var(--accent);font-weight:700;font-size:13px">Ask Mazzi</span>' +
        '<span class="dim" style="font-size:10px;margin-left:8px">AI coach · grounded in today\u2019s engine data</span></div>' +
        '<button class="btn-sm" onclick="mazziClear()">Clear</button>' +
      '</div>' +
      '<div class="ai-scroll" id="mazzi-scroll">' + (st.history.length ? st.history.map(mazziBubble).join('') : mazziGhost()) + '</div>' +
      '<div style="padding:10px 12px;border-top:1px solid var(--border)">' +
        '<div class="ai-row">' +
          ['Explain today\u2019s reading', 'What should I focus on today?', 'Wealth move today?', 'What about relationships?'].map(q =>
            '<span class="ai-chip" data-q="' + q.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;') + '">' + q + '</span>'
          ).join('') +
        '</div>' +
        '<div class="ai-input-row">' +
          '<textarea id="mazzi-input" placeholder="Ask about today\u2019s reading, a house, a transit, timing..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();mazziSendAuto()}"></textarea>' +
          '<button id="mazzi-send" onclick="mazziSendAuto()">Send</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.querySelectorAll('.ai-chip').forEach(c => c.addEventListener('click', () => mazziSend(c.getAttribute('data-q'))));
  mazziScrollBottom();
  const inp = document.getElementById('mazzi-input');
  if (inp) inp.focus();
}

function mazziClear() {
  if (!window._mazzi.history.length) return;
  if (!confirm('Clear this conversation?')) return;
  window._mazzi.history = [];
  mazziPersist();
  rerenderChat();
}

function rerenderChat() {
  const scroll = document.getElementById('mazzi-scroll');
  if (!scroll) return;
  const st = window._mazzi;
  scroll.innerHTML = st.history.length ? st.history.map(mazziBubble).join('') : mazziGhost();
  mazziScrollBottom();
}

function mazziSendAuto() {
  const inp = document.getElementById('mazzi-input');
  mazziSend(inp ? inp.value : '');
}

async function mazziSend(text) {
  const inp = document.getElementById('mazzi-input');
  const question = String(text === undefined ? (inp ? inp.value : '') : text).trim();
  if (!question) return;
  if (inp) inp.value = '';
  const st = window._mazzi;
  st.history.push({ role: 'user', content: question });
  mazziPersist();
  rerenderChat();

  const scroll = document.getElementById('mazzi-scroll');
  const typing = document.createElement('div');
  typing.className = 'ai-msg ai-bot ai-typing';
  typing.textContent = 'Mazzi is reading your chart…';
  if (scroll) { scroll.appendChild(typing); mazziScrollBottom(); }

  const sendBtn = document.getElementById('mazzi-send');
  if (sendBtn) sendBtn.disabled = true;

  const historyForApi = st.history.slice(-8).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));

  let reply = '⚠️ Something went wrong.';
  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ question, context: mazziContext(), history: historyForApi }),
    });
    if (r.status === 401) { location.href = '/'; return; }
    const d = await r.json().catch(() => ({}));
    reply = (r.ok && d.text) ? d.text : ('⚠️ ' + (d.error || ('Request failed (' + r.status + ')')));
  } catch (e) {
    reply = '⚠️ Network error. Check your connection and try again.';
  }
  if (sendBtn) sendBtn.disabled = false;
  st.history.push({ role: 'bot', content: reply });
  mazziPersist();
  rerenderChat();
}

function mazziLogout() {
  fetch('/api/logout', { method: 'POST' }).then(() => { location.href = '/'; });
}

// Initial render
renderToday();
</script>
